name: Módulo 1 - CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-validate:
    name: 🔎 Code Quality & Types
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout del código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🧪 Validar Tipos de TypeScript
        run: npx tsc --noEmit

      - name: 📊 Ejecutar Pruebas y Cobertura
        run: npm run coverage

  build-and-package:
    name: 🛠️ Build and Verify Bundle
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: 🧩 Checkout del código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🔨 Compilar Lambdas con esbuild
        run: npm run build

  terraform-check:
    name: 🏗️ Terraform Validate
    runs-on: ubuntu-latest
    needs: build-and-package
    steps:
      - name: 🧩 Checkout del código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: 🏁 Inicializar Terraform
        run: terraform init
        working-directory: ./terraform

      - name: 🔍 Validar archivos de Terraform
        run: terraform validate
        working-directory: ./terraform

      - name: 📏 Verificar formato (Fmt)
        run: terraform fmt -check
        working-directory: ./terraform